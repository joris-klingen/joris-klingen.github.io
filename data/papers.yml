- id: pollution_chess
  title: 'Risk taking and air pollution: Evidence from chess'
  coauthors:
  - Jos van Ommeren
  status: published
  year: 2023
  journal: Environmental and Resource Economics
  abstract: 'Medical research suggests that particulate matter (PM) increases stress hormones, therefore
    increasing the feeling of stress, which has been hypothesized to induce individuals to take less risk.
    To examine this, we study whether PMs increases the probability of drawing in chess games using information
    from the Dutch club competition. We provide evidence of a reasonably strong effect: A 10μg increase
    in PM₁₀ (33.0% of mean concentration) leads to a 0.5% increase to draw. We examine a range of explanations
    for these findings. Our preferred interpretation is that air pollution causes individuals to take
    less risk.'
  links:
    doi: 10.1007/s10640-021-00618-1
- id: smartphones_road_safety
  title: 'Hands on the wheel, eyes on the phone: The effect of smartphone usage on road safety'
  coauthors:
  - Devi Brands
  - Francis Ostermeijer
  status: published
  year: 2022
  journal: European Economic Review
  abstract: We provide novel evidence on the effect of smartphone use on road accidents. We exploit variation
    in phone usage fees in the Netherlands following a change in European Union roaming regulations implemented
    in 2017. The growth rate of mobile data roaming increased substantially after the change, which allows
    us to estimate a difference-in-differences model where non-Dutch drivers from the EU are treated,
    while Dutch drivers serve as control group. Our results suggest that around 10% of vehicles involved
    in accidents can be explained by the use of smartphones, and that these accidents mainly happen on
    urban roads.
  links:
    doi: 10.1016/j.euroecorev.2022.104130
- id: gender_cycling_nyc
  title: 'Inclusive roads in NYC: Gender differences in responses to cycling infrastructure'
  coauthors:
  - Laila Ait Bihi Ouali
  status: published
  year: 2022
  journal: Cities
  abstract: This paper tests whether and to what extent the implementation of bike infrastructure increases
    the propensity to cycle overall and by gender. We use large-scale Citibike data recording customer
    behaviours for New York City for years going from 2013 to 2019. We find that dedicated cycling infrastructure
    increases women's participation in cycling by 4% to 6%. This corroborates the hypothesis that both
    genders are more likely to take a transport mode when it is safer, with a larger response for the
    subgroup of women.
  links:
    doi: 10.1016/j.cities.2022.103719
- id: ozone_london
  title: 'Urban air pollution and time losses: Evidence from cyclists in London'
  coauthors:
  - Jos van Ommeren
  status: published
  year: 2020
  journal: Regional Science and Urban Economics
  abstract: We provide novel evidence of the immediate impact of air pollution on time delays in urban
    outdoor activities. We focus on ambient ozone, which is known to reduce lung capacity. We estimate
    its effect on cycling speed in London using several estimation strategies, and find that ozone reduces
    speed for concentrations above 20 ppb, which is far below the minimum threshold suggested by other
    studies. A 10 ppb increase in ozone concentration leads to a 0.3–0.4% reduction in cycling speed.
    Despite that most cycling trips are short, it seems plausible that ozone induces time losses of similar
    magnitude of other outdoor activities, such as walking.
  links:
    doi: 10.1016/j.regsciurbeco.2019.103504
    page: ozone-cycling.html
- id: metro_velib
  title: Do metro interruptions increase the demand for public rental bicycles? Evidence from Paris
  status: published
  year: 2019
  journal: Transportation Research Part A
  abstract: This paper studies demand for public rental bicycles following local and temporary metro interruptions
    in Paris. I construct a unique data set by linking metro interruptions announced by Twitter communication
    by the Parisian metro operator to usage data on the Vélib' PBL. I find that, as a direct consequence
    of a metro interruption, the consumption of bicycles within 1000m of metro stations increases by 0.17
    bicycles per hour per docking station on average, and with 1.36 bicycles per hour per docking station
    during the first 30 min; an increase of approximately 15% and 22% respectively. Due to their effects
    on demand, metro interruptions increase the probability of empty stocks at docking stations with 15%.
    The findings highlight that cycling is a local net substitute for metro service, and that public rental
    bicycles can alleviate time losses stemming from interruptions in public transport.
  links:
    doi: 10.1016/j.tra.2018.10.018
